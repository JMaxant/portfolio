baseURL = 'https://www.julien-maxant.com/'
locale = 'fr-FR'
title = 'Julien Maxant'
copyright = '2026 - Julien Maxant'
defaultContentLanguage = 'fr'
defaultContentLanguageInSubdir = false
removePathAccents = true
# A term page title keeps the tag as authored (`PHP`), instead of title-casing `css` into `Css`.
capitalizeListTitles = false
# Rendered from layouts/robots.txt. See docs/seo.md#robotstxt.
enableRobotsTXT = true

[params]
madeWith = 'Made with Hugo'
baseline = 'Développement web'
# Last fallback of the meta description, for a page with neither a description nor content.
description = 'Julien Maxant, lead tech et développeur web depuis 2017 : PHP, Drupal, Symfony, JS, Vue, Go, Python.'
# The sections that count as publications: the home page's latest activity and the main RSS feed.
mainSections = ['projets', 'blog']

[params.author]
name = 'Julien Maxant'
# Read by the JSON-LD Person node only. See docs/seo.md#structured-data.
jobTitle = 'Lead tech'
knowsAbout = [
  'PHP',
  'Drupal',
  'Symfony',
  'JavaScript',
  'Vue.js',
  'Go',
  'Python',
]

# Profiles on other sites, in display order. The JSON-LD Person lists them as sameAs.
[[params.social]]
name = 'GitHub'
url = 'https://github.com/JMaxant'

[[params.social]]
name = 'LinkedIn'
url = 'https://www.linkedin.com/in/julien-maxant/'

# The tag index lists terms, not content: a feed of it has nothing to follow.
[outputs]
home = ['html', 'rss', 'llms', 'headers']
taxonomy = ['html']

# index.md next to the HTML of a blog article or project, rendered from layouts/_default/single.md.
# Enabled by the cascade of content/blog and content/projets. See docs/seo.md#markdown-versions.
[outputFormats.markdown]
baseName = 'index'
mediaType = 'text/markdown'
isPlainText = true

# /llms.txt, rendered from layouts/index.llms.txt. See docs/seo.md#llmstxt.
[outputFormats.llms]
baseName = 'llms'
mediaType = 'text/plain'
isPlainText = true
notAlternative = true

# /_headers, rendered from layouts/index.headers: the canonical Link header of each Markdown
# version, read by Cloudflare. See docs/seo.md#markdown-versions.
[mediaTypes.'text/x-cloudflare-headers']
delimiter = ''
suffixes = ['']

[outputFormats.headers]
baseName = '_headers'
mediaType = 'text/x-cloudflare-headers'
isPlainText = true
notAlternative = true

# Most recent items per feed. Items carry their full content, so an unbounded feed grows with
# every post. See docs/seo.md#feeds.
[services.rss]
limit = 20

[taxonomies]
tag = 'tags'

[markup]
[markup.highlight]
# Emit class names instead of inline styles, so the palette lives in
# 11-code.css and follows the theme. See docs/css-tokens.md.
noClasses = false

[params.meta]
favicon = false
