# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  HUGO: hugo

tasks:
  default:
    desc: List all available tasks.
    cmds:
      - task --list

  setup:
    desc: Set up the local dev environment (installs the lefthook git hook).
    cmds:
      - lefthook install

  hugo:serve:
    aliases: [serve, dev, run]
    cmd: "{{.HUGO}} serve -D"
