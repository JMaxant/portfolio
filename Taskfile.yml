# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  HUGO: hugo

tasks:
  default:
    desc: List all available tasks.
    cmds:
      - task --list

  node:check:
    internal: true
    vars:
      NODE_REQUIRED:
        sh: cut -d. -f1 .nvmrc
      NODE_FOUND:
        sh: node --version
    preconditions:
      - sh: test "$(node -p 'process.versions.node.split(".")[0]')" -ge "{{.NODE_REQUIRED}}"
        msg: "Node {{.NODE_REQUIRED}}+ required (.nvmrc), found {{.NODE_FOUND}}. Switch with nvm/fnm/mise."

  setup:
    desc: Set up the local dev environment (installs npm deps and the lefthook git hook).
    deps: [node:check]
    cmds:
      - npm ci
      - npx lefthook install

  setup:fonts:
    desc: Create/refresh the local Python venv with fontmake and fonttools (see docs/fonts.md).
    cmds:
      - uv venv scripts/fonts/.venv
      - uv pip sync --python scripts/fonts/.venv/bin/python scripts/fonts/requirements.txt

  qa:
    desc: Run every quality check on all files (exactly what CI's quality job runs).
    deps: [node:check]
    cmd: npx lefthook run pre-commit --all-files

  qa:fix:
    desc: Auto-fix what the quality checks can fix (stylelint, taplo, markdownlint); the rest stays manual.
    cmds:
      - npx stylelint --fix $(git ls-files '*.css')
      - npx --yes @taplo/cli@0.7.0 fmt $(git ls-files '*.toml')
      - npx --yes markdownlint-cli2@0.23.2 --fix $(git ls-files '*.md' ':!docs/**')

  test:layout:
    desc: Run the Playwright layout suite (horizontal overflow) — not part of `task qa`, see docs/tests-layout.md.
    # Chromium only: firefox/webkit run in CI (.github/workflows/playwright.yml).
    cmds:
      - task: test:layout:browser
      - npx playwright test --project=chromium

  test:layout:browser:
    desc: Download the Chromium build Playwright drives.
    cmd: npx playwright install chromium


  hugo:serve:
    aliases: [serve, dev, run]
    cmd: "{{.HUGO}} serve -D --cleanDestinationDir --disableFastRender"
