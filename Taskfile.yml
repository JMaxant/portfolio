# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  HUGO: hugo

tasks:
  default:
    desc: List all available tasks.
    cmds:
      - task --list

  setup:
    desc: Set up the local dev environment (installs npm deps and the lefthook git hook).
    cmds:
      - npm ci
      - npx lefthook install

  qa:
    desc: Run every quality check on all files (exactly what CI's quality job runs).
    cmd: npx lefthook run pre-commit --all-files

  qa:fix:
    desc: Auto-fix what the quality checks can fix (stylelint, taplo, markdownlint); the rest stays manual.
    cmds:
      - npx stylelint --fix $(git ls-files '*.css')
      - npx --yes @taplo/cli@0.7.0 fmt $(git ls-files '*.toml')
      - npx --yes markdownlint-cli2@0.23.2 --fix $(git ls-files '*.md' ':!docs/**')

  test:layout:browser:
    desc: Download the Chromium build Playwright drives (~650 MB under ~/.cache/ms-playwright).
    # The browser is NOT an npm package: `npm ci` — so `task setup` — never
    # installs it, and a fresh clone fails all 396 tests in 1ms with "Executable
    # doesn't exist". Kept out of `task setup` so contributors who never touch
    # the layout suite do not pay 650 MB for it.
    #
    # `chromium` pulls two binaries: the headless shell that actually runs the
    # suite, and full Chromium for `npx playwright test --headed` / `--ui`.
    # Installing only the shell would halve the footprint but leave CI and local
    # runs on different rendering paths — not a trade this project makes.
    cmd: npx playwright install chromium

  test:layout:
    desc: Run the Playwright layout suite (horizontal overflow) — not part of `task qa`, see docs/tests-layout.md.
    cmds:
      - task: test:layout:browser
      - npx playwright test

  hugo:serve:
    aliases: [serve, dev, run]
    cmd: "{{.HUGO}} serve -D --cleanDestinationDir --disableFastRender"
