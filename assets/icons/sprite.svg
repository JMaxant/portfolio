<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true">
  <!-- Icon sprite, consumed as <svg><use href="#icon-name"></use></svg>.
       Presentation attributes sit on each symbol, not on this root: <use> clones the symbol
       into the shadow tree, which inherits from the use site, not from here.
       aria-hidden and the visually-hidden label belong on the consuming <svg>. -->

  <symbol id="icon-external-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 14v4.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 3 18.5v-11A2.5 2.5 0 0 1 5.5 5H10"></path>
    <path d="M14.5 3H21v6.5"></path>
    <path d="M12 12 20.5 3.5"></path>
  </symbol>

  <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.6 3.7A9 9 0 1 0 19.9 16.3 9 9 0 0 1 8.6 3.7Z"></path>
  </symbol>

  <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"></path>
  </symbol>

  <!-- Same disc and rays as icon-sun, right half filled: the pair reads as one family. -->
  <symbol id="icon-theme-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 8a4 4 0 0 1 0 8Z" fill="currentColor" stroke="none"></path>
    <path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M2 12h2.5M4.2 19.8 6 18"></path>
  </symbol>
</svg>
