{{ define "main" }}
  <div class="page">
    <div class="container">
      <h1>{{ .Title }}</h1>
      {{ with .Content }}{{ . }}{{ end }}

      {{ with .Pages }}
        <div class="cards cards--grid">
          {{ range . }}
            {{ partial "card.html" (dict "page" . "variant" "projet" "title_level" "h2") }}
          {{ end }}
        </div>
      {{ else }}
        <p>{{ i18n "no-projects" }}</p>
      {{ end }}
    </div>
  </div>
{{ end }}
