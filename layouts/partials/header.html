<div class="container--wide">
  <a class="skip-link" href="#main-content">{{ i18n "skip-link" }}</a>

  {{ if .IsHome }}
  <div class="site-title">
    {{ .Site.Title }}
    <span>{{ .Site.Params.baseline }}</span>
  </div>
  {{ else }}
  <div>
    <a href="{{ relURL .Site.Home.RelPermalink }}" class="site-title">
      {{ .Site.Title }}
      <span>{{ .Site.Params.baseline }}</span>
    </a>
  </div>
  {{ end }}

  {{- partial "nav.html" . -}}

  <div class="theme-switcher">{{- partial "theme-switcher.html" . -}}</div>

</div>
