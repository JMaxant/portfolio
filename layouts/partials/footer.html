<div class="container--wide">
  <nav aria-label='{{ i18n "nav-footer-socials" }}'>
    <ul class="menu menu--footer --socials" role="list">
      {{ range site.Params.social }}
        <li>
          <a href="{{ .url  }}" target="_blank" rel="noopener">
            {{ .name }}
            {{ partial "icon.html" (dict "name" "external-link" "label" (i18n "external-link")) }}

          </a>
        </li>
      {{ end }}
    </ul>
  </nav>

  <nav aria-label='{{ i18n "nav-footer" }}'>
    <ul class="menu menu--footer --secondary-nav" role="list">
      <li>
        <a href='{{ absURL "index.xml" }}'>RSS</a>
      </li>
      <li>
        <a href='{{ absURL "plan-du-site/" }}'>{{ i18n "site-map" }}</a>
      </li>
      <li>
        <a href='{{ absURL "llms.txt" }}'>LLMs.txt</a>
      </li>
    </ul>
  </nav>
</div>

<div class="container copyright">
  <p>
    {{ .Site.Copyright }} | {{ markdownify .Site.Params.madeWith }}
  </p>
</div>
