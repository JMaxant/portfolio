pre-commit:
  parallel: true
  commands:
    editorconfig:
      glob: "*"
      run: npx editorconfig-checker {staged_files}

    conflict-markers:
      run: "! git grep -nE '^(<{7}|={7}|>{7})( |$)'"

    taplo-fmt:
      glob: "*.toml"
      run: npx --yes @taplo/cli@0.7.0 fmt --check {staged_files}

    taplo-lint:
      glob: "*.toml"
      run: npx --yes @taplo/cli@0.7.0 lint {staged_files}

    markdownlint:
      glob: "*.md"
      exclude:
        - "docs/**"
      run: npx --yes markdownlint-cli2@0.23.2 {staged_files}

    stylelint:
      glob: "*.css"
      run: npx stylelint {staged_files}

    eslint:
      glob: "*.{js,mjs}"
      run: npx eslint {staged_files}

    cv-schema:
      glob: "assets/cv.json"
      run: node scripts/quality/check-cv-schema.mjs {staged_files}

    contrast:
      glob: "assets/styles/base/tokens.css"
      run: node scripts/quality/check-contrast.mjs

    actionlint:
      glob: ".github/workflows/*.yml"
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 {staged_files}

    hugo-build:
      run: scripts/quality/check-hugo-build.sh
