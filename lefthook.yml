pre-commit:
  parallel: true
  commands:
    whitespace-and-conflicts:
      glob: "*"
      # Empty tree vs index: checks every tracked file as it will be committed,
      # both in pre-commit and in CI's --all-files run (where index == HEAD).
      run: git diff --check --cached "$(git hash-object -t tree /dev/null)"

    taplo-fmt:
      glob: "*.toml"
      run: npx --yes @taplo/cli@0.7.0 fmt --check {staged_files}

    taplo-lint:
      glob: "*.toml"
      run: npx --yes @taplo/cli@0.7.0 lint {staged_files}

    markdownlint:
      glob: "*.md"
      exclude:
        - "docs/**"
      run: npx --yes markdownlint-cli2@0.23.2 {staged_files}

    stylelint:
      glob: "*.css"
      run: npx stylelint {staged_files}

    hugo-build:
      run: scripts/quality/check-hugo-build.sh
