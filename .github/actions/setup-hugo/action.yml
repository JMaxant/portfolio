name: Setup Hugo toolchain
description: Pinned Hugo extended.

inputs:
  hugo-version:
    description: Hugo extended version — the single place to bump it.
    default: "0.164.0"

runs:
  using: composite
  steps:
    - uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ inputs.hugo-version }}
        extended: true
