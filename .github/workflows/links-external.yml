name: External links

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links-external:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-hugo

      - run: hugo --gc --minify

      - name: Check all links online
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: '"public/**/*.html"'
          output: ./lychee-report.md
          fail: false

      - name: Find existing link-rot issue
        if: steps.lychee.outputs.exit_code != 0
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh issue list --label link-rot --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update link-rot issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Dead links detected by the weekly check
          content-filepath: ./lychee-report.md
          labels: link-rot
          issue-number: ${{ steps.issue.outputs.number }}
