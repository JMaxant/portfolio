name: External links

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links-external:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-hugo

      - run: hugo --gc --minify

      - name: Check all links online
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Same root and remap as the per-PR job in ci.yml: without them every root-relative
          # link of the built files is reported as an error.
          args: >-
            --root-dir "${{ github.workspace }}/public"
            --remap 'https://www.julien-maxant.com(.*) file://${{ github.workspace }}/public$1'
            "public/**/*.html"
          output: ./lychee-report.md
          # The issue below is the signal, so dead links do not fail the job. A crash of lychee
          # itself does: see the last step.
          fail: false

      - name: Find existing link-rot issue
        if: steps.lychee.outputs.exit_code != 0
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh issue list --label link-rot --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update link-rot issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Dead links detected by the weekly check
          content-filepath: ./lychee-report.md
          labels: link-rot
          issue-number: ${{ steps.issue.outputs.number }}

      - name: Close the link-rot issue once the report is clean
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for number in $(gh issue list --label link-rot --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "The weekly check found no dead link."
          done

      # lychee exits 1 when it could not run at all, 2 when it found dead links.
      - name: Fail when lychee itself crashed
        if: steps.lychee.outputs.exit_code == 1
        run: |
          echo "::error::lychee failed to run, see the Check all links online step"
          exit 1
