# Shared lychee config. The internal (per-PR) check adds --offline on the CLI;
# the weekly external check runs online with these settings as-is.
no_progress = true
include_fragments = "full"
max_retries = 2
timeout = 20
cache = false
accept = ["200..=204", "429"]
# LinkedIn answers 999 to any non-browser client. The profile is checked in a real browser by
# tests/live/smoke.spec.js instead.
exclude = ["^mailto:", "^https://(www\\.)?linkedin\\.com/"]
