repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: taplo-fmt
        name: taplo fmt --check
        language: node
        additional_dependencies: ["@taplo/cli@0.7.0"]
        entry: taplo fmt --check
        files: \.toml$

      - id: taplo-lint
        name: taplo lint
        language: node
        additional_dependencies: ["@taplo/cli@0.7.0"]
        entry: taplo lint
        files: \.toml$

      - id: markdownlint
        name: markdownlint-cli2
        language: node
        additional_dependencies: ["markdownlint-cli2@0.23.2"]
        entry: markdownlint-cli2
        files: \.md$
        exclude: ^docs/

      - id: hugo-build
        name: hugo build (fail on warnings)
        language: system
        entry: scripts/quality/check-hugo-build.sh
        pass_filenames: false
        always_run: true
